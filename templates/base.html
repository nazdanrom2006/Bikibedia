{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Bikibedia{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'wiki/css/wiki.css' %}">
</head>
<body>
    <div id="top">
        <a href="{% url 'home' %}" id="sitename">Bikibedia</a>
        <div id="userlinks">
            <a href="{% url 'login' %}">Log in</a>
            <a href="{% url 'register' %}">Register</a>
        </div>
    </div>
    <div id="layout">
        <div id="menu">
            <a href="{% url 'home' %}">Main page</a>
            <a href="{% url 'articles' %}">Articles</a>
            <a href="{% url 'example_article' %}">Example article</a>
        </div>
        <div id="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
